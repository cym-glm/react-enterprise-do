<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <script>
      const redirect = sessionStorage.redirect
      if (redirect) {
        delete sessionStorage.redirect
        window.history.replaceState(
          null,
          null,
          redirect
        )
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
